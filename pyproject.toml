[project]
name = "resumate"
version = "1.1.0"
description = "Resume field extraction (DistilBERT + rules) and resume-job matching."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["resumate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
